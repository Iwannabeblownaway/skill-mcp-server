{% extends "base.html" %}

{% block title %}创建用户 - Skill MCP Admin{% endblock %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800">创建用户</h1>
    <p class="text-gray-600 mt-2">创建新用户并生成 API Key</p>
</div>

<div class="max-w-lg">
    <div class="bg-white rounded-lg shadow p-6">
        <form method="post" action="/admin/users/create">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="user_id">
                    User ID <span class="text-gray-400">(可选)</span>
                </label>
                <input type="text" id="user_id" name="user_id"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="留空则自动生成">
                <p class="text-gray-500 text-xs mt-1">用户的唯一标识，不填则自动生成</p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
                    用户名 <span class="text-red-500">*</span>
                </label>
                <input type="text" id="username" name="username" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="显示名称">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="role">
                    角色
                </label>
                <select id="role" name="role"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="user">普通用户</option>
                    <option value="admin">管理员</option>
                </select>
            </div>

            <div class="flex items-center justify-between">
                <a href="/admin/users" class="text-gray-600 hover:text-gray-800">
                    ← 返回列表
                </a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition">
                    创建用户
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
