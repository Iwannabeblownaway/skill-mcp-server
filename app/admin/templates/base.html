<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skill MCP Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex space-x-8">
                    <a href="/admin" class="inline-flex items-center px-2 py-2 text-gray-700 hover:text-blue-600 {% if request.url.path == '/admin' %}text-blue-600 font-semibold{% endif %}">
                        概览
                    </a>
                    <a href="/admin/users" class="inline-flex items-center px-2 py-2 text-gray-700 hover:text-blue-600 {% if '/admin/users' in request.url.path %}text-blue-600 font-semibold{% endif %}">
                        用户
                    </a>
                    <a href="/admin/skills" class="inline-flex items-center px-2 py-2 text-gray-700 hover:text-blue-600 {% if '/admin/skills' in request.url.path %}text-blue-600 font-semibold{% endif %}">
                        技能
                    </a>
                    <a href="/admin/authorizations" class="inline-flex items-center px-2 py-2 text-gray-700 hover:text-blue-600 {% if '/admin/authorizations' in request.url.path %}text-blue-600 font-semibold{% endif %}">
                        授权
                    </a>
                    <a href="/admin/logs" class="inline-flex items-center px-2 py-2 text-gray-700 hover:text-blue-600 {% if '/admin/logs' in request.url.path %}text-blue-600 font-semibold{% endif %}">
                        日志
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-500">{{ admin_user.username }}</span>
                    <a href="/admin/logout" class="inline-flex items-center px-3 py-1 text-sm text-white bg-red-600 hover:bg-red-700 rounded-md">
                        退出
                    </a>
                </div>

            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Flash Message (from sessionStorage, auto-cleared) -->
        <div id="flash-message" class="mb-4 p-4 pr-16 rounded-lg relative hidden">
            <span id="flash-text"></span>
            <span id="flash-countdown" class="absolute right-10 top-1/2 -translate-y-1/2 text-sm opacity-60"></span>
            <button type="button" onclick="document.getElementById('flash-message').classList.add('hidden')" class="absolute top-2 right-2 w-6 h-6 flex items-center justify-center rounded-full hover:bg-black/10 text-current">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-auto py-4">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 text-sm">
            Skill MCP Server Admin Panel
        </div>
    </footer>

    <script>
    (function() {
        const msg = sessionStorage.getItem('flash_message');
        const type = sessionStorage.getItem('flash_message_type');
        if (msg) {
            const el = document.getElementById('flash-message');
            const textEl = document.getElementById('flash-text');
            const countdownEl = document.getElementById('flash-countdown');
            textEl.textContent = msg;
            el.classList.remove('hidden');
            if (type === 'error') {
                el.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-400');
            } else {
                el.classList.add('bg-green-100', 'text-green-700', 'border', 'border-green-400');
            }
            // Clear immediately after reading
            sessionStorage.removeItem('flash_message');
            sessionStorage.removeItem('flash_message_type');
            // Auto hide after 5 seconds with countdown
            let remaining = 5;
            countdownEl.textContent = remaining + 's';
            const timer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(timer);
                    el.classList.add('hidden');
                } else {
                    countdownEl.textContent = remaining + 's';
                }
            }, 1000);
        }
    })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
