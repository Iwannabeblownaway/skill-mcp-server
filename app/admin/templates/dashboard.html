{% extends "base.html" %}

{% block title %}概览 - Skill MCP Admin{% endblock %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800">仪表盘</h1>
    <p class="text-gray-600 mt-2">系统运行概览</p>
</div>

<!-- Stats Cards -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-gray-500 text-sm">用户总数</p>
                <p class="text-3xl font-bold text-gray-800">{{ user_count }}</p>
            </div>
            <div class="bg-blue-100 rounded-full p-3">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </div>
        </div>
        <div class="mt-4">
            <a href="/admin/users" class="text-blue-600 hover:text-blue-800 text-sm">管理用户 →</a>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-gray-500 text-sm">技能总数</p>
                <p class="text-3xl font-bold text-gray-800">{{ skill_count }}</p>
            </div>
            <div class="bg-green-100 rounded-full p-3">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>
            </div>
        </div>
        <div class="mt-4">
            <a href="/admin/skills" class="text-green-600 hover:text-green-800 text-sm">管理技能 →</a>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-gray-500 text-sm">授权总数</p>
                <p class="text-3xl font-bold text-gray-800">{{ auth_count }}</p>
            </div>
            <div class="bg-purple-100 rounded-full p-3">
                <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
        </div>
        <div class="mt-4">
            <a href="/admin/authorizations" class="text-purple-600 hover:text-purple-800 text-sm">管理授权 →</a>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-gray-500 text-sm">技能总数</p>
                <p class="text-3xl font-bold text-gray-800">{{ skill_count }}</p>
            </div>
            <div class="bg-orange-100 rounded-full p-3">
                <svg class="w-8 h-8 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
        </div>
        <div class="mt-4">
            <a href="/admin/logs" class="text-orange-600 hover:text-orange-800 text-sm">查看日志 →</a>
        </div>
    </div>
</div>

<!-- Quick Links -->
<div class="bg-white rounded-lg shadow p-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">快捷操作</h2>
    <div class="flex flex-wrap gap-4">
        <a href="/admin/users/create" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">
            + 创建用户
        </a>
        <a href="/admin/skills/create" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition">
            + 创建技能
        </a>
        <a href="/admin/authorizations" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition">
            管理授权
        </a>
        <a href="/admin/logs" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg transition">
            查看日志
        </a>
    </div>
</div>
{% endblock %}
